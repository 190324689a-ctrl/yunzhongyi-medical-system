# 云中医医务系统 · Docker Compose 一键启动
# 用法：docker compose up --build
#   后端：http://localhost:8080
#   前端：http://localhost:4173
#   MySQL：localhost:3306（库 medical / 用户 medical / 密码 medical123）
services:
  mysql:
    image: mysql:8.0
    container_name: yzy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: medical
      MYSQL_USER: medical
      MYSQL_PASSWORD: medical123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建表 + 种子数据
      - ./backend/src/main/resources/schema-mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yzy-backend
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medical?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: medical
      SPRING_DATASOURCE_PASSWORD: medical123
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yzy-frontend
    ports:
      - "4173:80"
    depends_on:
      - backend

volumes:
  mysql-data:
